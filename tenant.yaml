# =============================================================================
#  vxnode — tenant onboarding config   (consumed by setup.sh)
# =============================================================================
#  setup.sh installs vxnode on EVERY instance listed below — one, two, or many:
#      1) tenant_prerequisites.sh   (Docker, packages, registry auth)
#      2) tenant_setup.sh           (vxnode container + nginx + SSL)
#  Codebase/IDE installers and tenant agents are NOT run here — vxnode comes up
#  first; provision those afterward (tenant_codebase/, tenant_agents/).
#
#  RUN:
#      ./setup.sh                       # all instances in this file
#      ./setup.sh --only 778ipdnsloadbalancraddress001391
#      ./setup.sh --list                # show resolved instances, do nothing
#
#  This YAML is the source of truth. tenant.json is an exact mirror used
#  automatically only if a YAML parser (python3 PyYAML) is unavailable.
#
#  `defaults` apply to every instance unless the instance overrides the key.
#  Leave ssh_host blank on an instance to install on THIS machine (local).
# =============================================================================

defaults:
  email: joelwembo@outlook.com        # Let's Encrypt SSL contact (shared)
  ssh_port: 22
  docker_username: vxcloud            # image-pull user (demo)
  docker_pat: ""   # leave blank for the public vxcloud/vxnode image
  app_port: 8744                      # vxnode API port
  connection_token: CHANGE_ME_SET_YOUR_OWN_TOKEN   # IDE (openvscode) browser token — passed to the IDE installer
  install_ide: false                  # keep the distribution focused on the vxnode runtime

instances:
  # The relay node (node-8mlh0qaqg6 / 51.79.206.57) is deliberately omitted.
